---
# -------------------------
# Create groups if not exist
# -------------------------
- name: Create groups with optional gid
  group:
    name: "{{ item.name }}"
    gid: "{{ item.gid | default(omit) }}"
    state: present
  loop: "{{ allowed_groups }}"

# -------------------------
# Build allowed group name list
# -------------------------
- name: Extract allowed group names
  set_fact:
    allowed_group_names: "{{ allowed_groups | map(attribute='name') | list }}"

# -------------------------
# Build user_config (with safe defaults)
# -------------------------
- name: Build effective user config
  set_fact:
    user_config: "{{ user_conf_default | combine({
        'groups': (target_groups | default(primary_group) | split(',') | map('trim') | list),
        'comment': user_conf_default.comment,
        'home_dir': user_conf_default.home_dir
      }, recursive=True) }}"

# -------------------------
# Validate requested groups exist
# -------------------------
- name: Validate requested groups
  assert:
    that:
      - item in allowed_group_names
    fail_msg: "Group '{{ item }}' is not allowed. Allowed: {{ allowed_group_names }}"
  loop: "{{ user_config.groups }}"

# -------------------------
# Show shell options
# -------------------------
- name: Show shell options
  debug:
    msg: |
      Available shells:
      {% for path,name in shell_options.items() %}
      {{ loop.index }}. {{ name }} ({{ path }})
      {% endfor %}

# -------------------------
# Prompt for primary group
# -------------------------
- name: Ask desired primary group
  pause:
    prompt: "Enter primary group ({{ allowed_group_names | join(', ') }}) [default: {{ primary_group }}]"
  register: group_input

- name: Set chosen primary group
  set_fact:
    chosen_primary_group: "{{ (group_input.user_input | trim) if (group_input.user_input | trim | length > 0) else primary_group }}"

- name: Validate chosen primary group
  assert:
    that:
      - chosen_primary_group in allowed_group_names
    fail_msg: "Group '{{ chosen_primary_group }}' is not allowed"

# -------------------------
# Account expiration prompt (REQUIRED, 0 = infinite)
# -------------------------
- name: Ask account expiration days
  pause:
    prompt: "Enter account expiration days from now (0 = infinite, required)"
  register: expire_input

- name: Validate account expiration input
  assert:
    that:
      - expire_input.user_input | trim | length > 0
      - expire_input.user_input is match('^[0-9]+$')
    fail_msg: "Account expiration days is required and must be numeric (0 = infinite)"

- name: Compute account expiration epoch
  set_fact:
    account_expires_epoch: "{{ (ansible_date_time.epoch | int) + ((expire_input.user_input | int) * 86400) }}"
  when: expire_input.user_input | int > 0

# if input == 0 → omit expires → infinite

# -------------------------
# Password expiration prompt (REQUIRED, 0 = infinite)
# -------------------------
- name: Ask password max days
  pause:
    prompt: "Enter password max days (0 = infinite, required)"
  register: passmax_input

- name: Validate password max days input
  assert:
    that:
      - passmax_input.user_input | trim | length > 0
      - passmax_input.user_input is match('^[0-9]+$')
    fail_msg: "Password max days is required and must be numeric (0 = infinite)"

- name: Set password max days fact
  set_fact:
    password_max_days: "{{ passmax_input.user_input | int }}"

# -------------------------
# Password flow
# -------------------------
- name: Collect password
  include_tasks: tasks/shared/password.yml

# -------------------------
# Create user (no same-name group)
# -------------------------
- name: Create user
  user:
    name: "{{ target_username }}"
    state: present
    password: "{{ encrypted_password | default(omit) }}"
    update_password: always
    shell: "{{ user_config.shell }}"
    comment: "{{ user_config.comment }}"
    create_home: "{{ user_config.create_home }}"
    home: "{{ user_config.home_dir }}"
    system: "{{ user_config.system_user }}"
    uid: "{{ user_config.uid | default(omit) }}"
    expires: "{{ account_expires_epoch | default(omit) }}"
    group: "{{ chosen_primary_group }}"
    groups: "{{ user_config.groups }}"
    append: true
  register: user_create_result

# -------------------------
# Set password aging policy
# -------------------------
- name: Set password expiration policy
  command: >
    chage -M {{ (password_max_days == 0) | ternary(-1, password_max_days) }}
           -m {{ security.password.min_days }}
           -W {{ security.password.warn_days }}
           {{ target_username }}
  changed_when: true
